# Politique Dependabot YieldStudio, revue apres l'incident Goldy du 13/08/2026.
#
#   cooldown  : delai avant qu'une version fraichement publiee soit proposee.
#               Protection directe contre une version empoisonnee restee en ligne
#               quelques heures, comme lors de la campagne ChainDrop du 04/08.
#               Les paliers semver ne sont acceptes que pour npm et composer ;
#               docker et github-actions n'acceptent que default-days.
#   groups    : effondre N pull requests en une seule, et rend la PR stable dans
#               le temps : elle se met a jour au lieu d'etre remplacee.
#   monthly   : les correctifs de securite restent immediats, ils ne passent pas
#               par ce fichier et ne sont pas concernes par ces reglages.
#
# Les cles propres au depot (target-branch, allow, ignore, versioning-strategy)
# sont conservees telles quelles.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 1
  cooldown:
    default-days: 7
  groups:
    github_actions:
      patterns:
      - '*'
